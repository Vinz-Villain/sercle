<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Produk - Sercle</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Swiper CSS -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>

<body class="bg-gradient-to-b from-gray-50 to-white">

<section class="min-h-screen flex items-center px-6 py-20">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-16 items-center">

    <!-- Tombol Kembali -->
    <div class="absolute top-6 left-6">
      <a href="index.html"
         class="group inline-flex items-center gap-2 
                bg-white/80 backdrop-blur-md 
                border border-gray-200 
                px-5 py-2.5 rounded-full 
                shadow-sm 
                text-gray-700 font-medium
                hover:bg-green-600 hover:text-white 
                hover:border-green-600
                transition-all duration-300">

        <span class="transform group-hover:-translate-x-1 transition">
          ←
        </span>
        Kembali ke Beranda
      </a>
    </div>
    
    <!-- Slider Produk -->
    <div class="relative">
      <div class="absolute -top-10 -left-10 w-72 h-72 bg-green-300 rounded-full blur-3xl opacity-20"></div>

      <div class="swiper mySwiper max-w-md mx-auto">
        <div class="swiper-wrapper">

          <div class="swiper-slide">
            <img src="assets/MockUp1.png" class="w-full">
          </div>

          <div class="swiper-slide">
            <img src="assets/MockUp2.png" class="w-full">
          </div>

          <div class="swiper-slide">
            <img src="assets/MockUp3.png" class="w-full">
          </div>

        </div>

        <!-- Pagination -->
        <div class="swiper-pagination"></div>

        <!-- Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
    </div>

    <!-- Detail Produk -->
    <div>
      <span class="inline-block bg-green-100 text-green-700 px-4 py-1 rounded-full text-sm mb-4">
        Botanical Based Formula
      </span>

      <h1 class="text-4xl font-bold leading-tight mb-6">
        Sercle Pengusir Serangga 500ml
      </h1>

      <p class="text-gray-600 text-lg mb-6">
        Solusi alami untuk menciptakan ruang yang lebih nyaman tanpa
        insektisida sintetis. Rasakan kenyamanan alami dengan aroma segar citrus dan rempah.
      </p>

      <div class="text-3xl font-bold mb-8">
        Rp 18.500
      </div>

      <div class="flex gap-4">
        <a href="detail.html"
           class="bg-green-600 text-white px-6 py-3 rounded-xl hover:bg-green-700 transition">
           Pelajari Lebih Lanjut
        </a>

        <a href="https://wa.me/62895605274321?text=Halo,%20Admin%20saya%20tertarik%20untuk%20membeli%20Sercle%20"
           class="border border-gray-300 px-6 py-3 rounded-xl hover:bg-gray-100 transition">
           Pesan Sekarang
        </a>
      </div>
    </div>

  </div>
</section>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
  var swiper = new Swiper(".mySwiper", {
    loop: true,
    spaceBetween: 20,
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    autoplay: {
      delay: 3000,
      disableOnInteraction: false,
    },
  });
</script>

</body>
</html>
